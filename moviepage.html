<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/9774534ce3.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="styles.css" />
    <title>Imdb clone</title>
  </head>
  <body>
    <nav>
      <div class="nav-logo">
        <a href="/IMDb-clone/"><img src="./assets/logo.png" alt="logo" /></a>
      </div>
      <div></div>
      <div><a href="/IMDb-clone/watchlist.html">Watchlist</a></div>
    </nav>

    <main>
      <div class="moviepage-container">
        <div class="moviepage-head">
          <h1 id="moviepage-title"></h1>
          <span id="moviepage-watchlist-status"></span>
        </div>
        <!-- movie detail goes here -->
        <div class="moviepage-detail-container">
          <div class="moviepage-poster">
            <img src="" alt="poster" id="moviepage-poster" />
          </div>

          <div class="moviepage-detail">
            <div>
              <span><b>IMDb Rating: </b></span>
              <span id="moviepage-rating"></span>
            </div>
            <div>
              <span><b>Released: </b></span>
              <span id="moviepage-released"></span>
            </div>
            <div>
              <span><b>Genere: </b></span>
              <span id="moviepage-genere"></span>
            </div>
            <div>
              <span><b>Director: </b></span>
              <span id="moviepage-director"></span>
            </div>
            <div>
              <span><b>Writer: </b></span>
              <span id="moviepage-writer"></span>
            </div>
            <div>
              <span><b>Actor: </b></span>
              <span id="moviepage-actor"></span>
            </div>
          </div>
        </div>
        <div>
          <span><b>Plot: </b></span>
          <span id="moviepage-plot"></span>
        </div>
      </div>
    </main>
  </body>
</html>
